<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление личных данных - Елки 12</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Удаление личных данных</h1>
        <p class="subtitle">Игра "Елки 12"</p>
        
        <form id="deleteForm">
            <div class="form-group">
                <label for="userId">ID пользователя</label>
                <input 
                    type="text" 
                    id="userId" 
                    name="userId" 
                    placeholder="Введите ID пользователя"
                    required
                    autocomplete="off"
                >
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                Отправить
            </button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        // URL сервера для отправки запроса
        const API_URL = 'https://your-server.com/api/delete-user-data';

        // Получаем элементы формы
        const form = document.getElementById('deleteForm');
        const userIdInput = document.getElementById('userId');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        // Функция для получения параметров из URL
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Проверяем параметры URL при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            const userIdFromUrl = getUrlParameter('id') || getUrlParameter('userId');
            if (userIdFromUrl) {
                userIdInput.value = userIdFromUrl;
            }
        });

        // Функция для показа сообщения
        function showMessage(text, isSuccess = true) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        // Функция для скрытия сообщения
        function hideMessage() {
            messageDiv.className = 'message';
        }

        // Обработка отправки формы
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = userIdInput.value.trim();
            
            if (!userId) {
                showMessage('Пожалуйста, введите ID пользователя', false);
                return;
            }

            // Блокируем кнопку и показываем загрузку
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Отправка...';
            hideMessage();

            try {
                // Отправляем запрос на сервер
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: userId
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Данные успешно удалены!', true);
                    userIdInput.value = '';
                } else {
                    showMessage(data.message || 'Произошла ошибка при удалении данных', false);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showMessage('Ошибка соединения с сервером. Пожалуйста, попробуйте позже.', false);
            } finally {
                // Разблокируем кнопку
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Отправить';
            }
        });
    </script>
</body>
</html>
